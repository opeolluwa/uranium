[package]
edition      = "2024"
name         = "uranium_migration"
publish      = false
rust-version = "1.85.0"
version      = "0.1.0"

[lib]
name = "uranium_migration"
path = "src/lib.rs"

[dependencies]
sea-orm = { version = "2.0.2" }
sea-orm-migration = { version = "2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full", "macros"] }
ulid = "1.2.1"


