[package]
name = "uranium"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["entities", "macros", "migration"]

[workspace.dependencies]
sea-orm = { version = "2.0.2" }
sea-orm-migration = { version = "2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
ulid = "1.2.1"

[lib]
name = "uranium_lib"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.11.1"
askama = "0.15.6"
axum = { version = "0.8.3", features = ["tracing"] }
axum-extra = { version = "0.10.1", features = ["typed-header"] }
axum-governor = "2.1.2"
base64 = "0.23.1"
bcrypt = "0.17.0"
chrono = { version = "0.4.41", features = ["serde"] }
entities = { version = "0.1.0", path = "entities", package = "uranium_entities" }
hex = "0.4.3"
jsonwebtoken = "9.3.1"
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "pool", "builder", "hostname", "tokio1-rustls", "ring", "rustls-native-certs"] }
log = "0.4.27"
migration = { version = "0.1.0", path = "migration", package = "uranium_migration" }
rand = "0.9"
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }
sea-orm = { workspace = true, features = ["runtime-tokio-rustls", "sqlx-postgres", "macros", "debug-print", "with-chrono", "with-uuid"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = "2.0.12"
tokio = { workspace = true }
tower-http = { version = "0.6.6", features = ["limit", "trace", "cors", "timeout", "sensitive-headers", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
axum = { version = "0.8.3", features = ["macros"] }
axum-test = "17.3.0"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
debug = false
incremental = false
